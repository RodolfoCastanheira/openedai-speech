services:
  speech:
    # image: ghcr.io/matatonic/openedai-speech
    image: registry.rodox.dns.army/openedai-speech
    pull_policy: always
    environment:
      - DEEPSPEED= # --use-deepspeed
      - TIMER="--unload-timer 600"
      - PRELOAD_MODEL=xtts
      - LOG=DEBUG # DEBUG,INFO,WARNING,ERROR,CRITICAL
      - EXTRA_ARGS=
    ports:
      - "8000:8000"
    volumes:
      - ./voices:/app/voices
      - ./config:/app/config
    restart: unless-stopped
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

