services:
  speech:
    # image: ghcr.io/matatonic/openedai-speech
    image: registry.rodox.dns.army/openedai-speech
    pull_policy: always
    #build:
    #  dockerfile: Dockerfile
    env_file: speech.env
    ports:
      - "8000:8000"
    volumes:
      - ./voices:/app/voices
      - ./config:/app/config
    restart: unless-stopped
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

